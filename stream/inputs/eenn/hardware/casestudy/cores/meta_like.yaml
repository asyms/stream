# meta_like: the Meta-prototype core from stream/inputs/examples/hardware/cores/meta_prototype.yaml,
# adapted for the case study. Two changes only, both required, neither touches the array or the
# memory sizes:
#   1. `multipliers:` renamed to `operational_array:`. The published file uses a key that
#      zigzag-dse 3.6.3 rejects, so it does not parse at all as committed.
#   2. An in-core DRAM identical to the anchor's added, so this core is not penalised relative
#      to edge_tpu_like (which has one) by having to reach off-chip over the NoC instead.
# multiplier_energy is already 0.04 pJ, the same as the anchor, so no normalisation is needed.
#
# Array 32x2x4x4 = 1024 MAC/cycle, on-chip 17,572,352 bit = 2.0948 MiB (anchor: 2.0320 MiB, +3.1%).
# Wiring: weight RF shared across [D3, D4] so one read feeds 16 multipliers, output RF shared
# across [D2], and separate weight and activation SRAM banks so the two do not share a port.
name: meta_like

memories:
  rf_1B:
    size: 8
    r_bw: 8
    w_bw: 8
    r_cost: 0.01
    w_cost: 0.01
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    auto_cost_extraction: False
    operands: [I2]
    ports:
      - fh: w_port_1
        tl: r_port_1
    served_dimensions: [D3, D4]

  rf_2B:
    size: 16
    r_bw: 16
    w_bw: 16
    r_cost: 0.02
    w_cost: 0.02
    area: 0
    r_port: 2
    w_port: 2
    rw_port: 0
    latency: 1
    operands: [O]
    ports:
      - fh: w_port_1
        tl: r_port_1
        fl: w_port_2
        th: r_port_2
    served_dimensions: [D2]

  sram_64KB:
    size: 524288
    r_bw: 512
    w_bw: 512
    r_cost: 26.56
    w_cost: 30.8
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    min_r_granularity: 64
    min_w_granularity: 64
    operands: [I2]
    ports:
      - fh: w_port_1
        tl: r_port_1
    served_dimensions: [D1, D2, D3, D4]

  sram_32KB:
    size: 262144
    r_bw: 256
    w_bw: 256
    r_cost: 13.28
    w_cost: 15.4
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    min_r_granularity: 64
    min_w_granularity: 64
    operands: [I1]
    ports:
      - fh: w_port_1
        tl: r_port_1
    served_dimensions: [D1, D2, D3, D4]

  sram_1MB_A:
    size: 8388608
    r_bw: 1024
    w_bw: 1024
    r_cost: 208.08
    w_cost: 189.2
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    min_r_granularity: 64
    min_w_granularity: 64
    operands: [I1, O]
    ports:
      - fh: w_port_1
        tl: r_port_1
      - fh: w_port_1
        tl: r_port_1
        fl: w_port_1
        th: r_port_1
    served_dimensions: [D1, D2, D3, D4]

  sram_1MB_W:
    size: 8388608
    r_bw: 1024
    w_bw: 1024
    r_cost: 208.08
    w_cost: 189.2
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    min_r_granularity: 64
    min_w_granularity: 64
    operands: [I2]
    ports:
      - fh: w_port_1
        tl: r_port_1
    served_dimensions: [D1, D2, D3, D4]

  dram:
    size: 10000000000
    r_bw: 64
    w_bw: 64
    r_cost: 700
    w_cost: 750
    area: 0
    r_port: 0
    w_port: 0
    rw_port: 1
    latency: 1
    operands: [I1, I2, O]
    ports:
      - fh: rw_port_1
        tl: rw_port_1
      - fh: rw_port_1
        tl: rw_port_1
      - fh: rw_port_1
        tl: rw_port_1
        fl: rw_port_1
        th: rw_port_1
    served_dimensions: [D1, D2, D3, D4]

operational_array:
  input_precision: [8, 8]
  multiplier_energy: 0.04 # pJ
  multiplier_area: 1 # unit
  dimensions: [D1, D2, D3, D4]
  sizes: [32, 2, 4, 4]
